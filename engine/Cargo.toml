[package]
name = "postflop-solver"
version = "0.1.0"
authors = ["Wataru Inariba"]
edition = "2021"
rust-version.workspace = true
description = "An open-source postflop solver for Texas hold'em poker"
documentation = "https://b-inary.github.io/postflop_solver/postflop_solver/"
repository = "https://github.com/b-inary/postflop-solver"
license = "AGPL-3.0-or-later"

[dependencies]
allocator-api2 = { version = "0.4.0", optional = true }
bincode = { version = "2.0.1", optional = true }
once_cell = "1.21.4"
rayon = { version = "1.12.0", optional = true }
regex = "1.13.1"
zstd = { version = "0.14.4", optional = true, default-features = false }

[features]
default = ["bincode", "rayon"]
custom-alloc = ["dep:allocator-api2"]
rayon = ["dep:rayon", "zstd?/zstdmt"]

[dev-dependencies]
mimalloc = "0.1.52"

[[bench]]
name = "reference_spot"
harness = false

[[bench]]
name = "reference_spot_mimalloc"
harness = false

[lints.clippy]
# Index-based loops are deliberate in the solver's numeric code (several
# slices indexed in lockstep); upstream's CI allowed this lint too.
needless_range_loop = "allow"
