[package]
name = "postflop-lab"
version = "0.2.7"
description = "Postflop GTO solver for study"
authors = ["Wataru Inariba", "Michael Maccio"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/micamdev/postflop-lab"
edition = "2021"
publish = false
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0.107"
serde = { version = "1.0.188", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
postflop-solver = { path = "../../engine" }
rayon = "1.8.0"
sysinfo = "0.29.10"
tauri-plugin-fs = "2.7.1"
tauri-plugin-opener = "2.7.3"
tauri-plugin-dialog = "2.8.4"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = [ "custom-protocol" ]
# this feature is used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = [ "tauri/custom-protocol" ]
