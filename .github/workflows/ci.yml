name: CI

# Monorepo: each project's job runs only when that project changed (always on main, before a
# release). A PR is checked once, a new push cancels the run in progress, and the last job,
# "CI ok", sums them up: it is the one check to require (a skipped job counts as passed).
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      desktop: ${{ steps.filter.outputs.desktop }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - "engine/**"
              - "desktop/src-tauri/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".github/workflows/ci.yml"
            desktop:
              - "desktop/**"
              - ".github/workflows/ci.yml"
            site:
              - "site/**"
              - ".github/workflows/ci.yml"

  rust:
    needs: changes
    # Always on main (before a release); on PRs, only when Rust code changed.
    if: needs.changes.outputs.rust == 'true' || github.ref == 'refs/heads/main'
    # Windows: the users' platform.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Version read from "packageManager" in desktop/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      # The Tauri build embeds desktop/dist, so the front end comes first.
      - name: Install front-end dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build front end
        working-directory: desktop
        run: pnpm build

      # Reads rust-toolchain.toml (version, rustfmt, clippy) and caches target/.
      # Its default RUSTFLAGS="-D warnings" turns every warning into an error.
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --release

      - name: Test engine with custom-alloc
        run: cargo test -p postflop-solver --release --features custom-alloc -- --test-threads 1

  front:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec vue-tsc --noEmit
      - run: pnpm test

  # The website (postflop.mica.app): it builds. Cloudflare deploys it from main.
  site:
    needs: changes
    if: needs.changes.outputs.site == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # The one check to require: fails if any job failed or was cancelled, passes when the
  # jobs that ran passed (the others were skipped: their project did not change).
  ci-ok:
    name: CI ok
    needs: [changes, rust, front, site]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job that ran passed
        run: |
          echo '${{ toJSON(needs) }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            exit 1
          fi
